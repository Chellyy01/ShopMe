<div class="product-card">
    <!-- Product image section with overlay and eye icon -->
    <div class="card-image">
        <img [src]="product.thumbnail" alt="{{ product.title }}" class="product-img" (error)="onImageError($event)">
        <!-- Overlay + eye icon for view details -->
        <div class="image-overlay">
            <button class="view-details-btn" aria-label="View product details" routerLink="/products/{{ product.id }}">
                <svg class="eye-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
            </button>
        </div>
    </div>

    <div class="card-content">
        <!-- Product Title -->
        <span class="stock-status"
            [ngClass]="product.availabilityStatus === 'In Stock' ? 'in-stock' : 'low-stock'">{{product.availabilityStatus}}</span>
        <h3 class="product-title">{{ product.title }}</h3>

        <!-- Price block -->
        <div class="product-price">
            <span class="currency">$</span>
            <span class="price-value">{{ product.price }}</span>
        </div>

        <!-- Rating block: dynamic rating (4.5 stars + count) -->
        @if(product.rating){
        <div class="rating-wrapper">
            <div class="rating-stars">
                <!-- 4 full stars -->
                @for(star of [1,2,3,4, 5]; track star){
                <span class="star star-filled">{{ star <= product.rating ? '★' : '☆' }}</span>
                        }
            </div>
            <span class="rating-value">{{ product.rating }}</span>
            <!-- <span class="rating-count">({{ product.reviewCount }} reviews)</span> -->
        </div>
        }

        <div class="divider-light"></div>

        <!-- ADD TO CART BUTTON with black background (modern) -->
        <button class="add-to-cart-btn" aria-label="Add to cart">
            <svg class="cart-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="21" r="1.5" />
                <circle cx="20" cy="21" r="1.5" />
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
            </svg>
            <span class="btn-text">Add to Cart</span>
        </button>
    </div>
</div>
