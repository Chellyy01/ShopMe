<div class="container">
    @if(isloading){
    <div class="loading-container">
        <div class="spinner"></div>
        <p>Loading products...</p>
    </div>
    }
    @if(errorMessage){
    <div class="error-message">
        {{ errorMessage }}
    </div>
    }
    @for(product of products; track product.id){
    <app-product-card [product]="product">
    </app-product-card>
    }
</div>
