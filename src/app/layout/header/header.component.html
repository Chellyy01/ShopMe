<!-- HEADER -->
<header [class.menu-open]="menuOpen">

    <a class="logo" routerLink="/">Exclusive</a>

    <button
        class="menu-toggle"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen"
        aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="header-collapse">
        <nav>
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Home</a>
            <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a>
            <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
            @if((authService.currentUser$ | async); as user) {
            <span class="welcome">Welcome, {{ user.firstName }}</span>
            <button type="button" (click)="logout()">Logout</button>
            }
            @else {
            <a routerLink="/register" routerLinkActive="active" (click)="closeMenu()">Sign Up</a>
            }
        </nav>

        <div class="header-actions">
            <form class="search-box" (ngSubmit)="onSearchedProduct()">
                <input type="text" placeholder="What are you looking for?" name="search" [(ngModel)]="searchedText" />
                <button class="icon-btn" type="submit" aria-label="Search">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                </button>
            </form>
            <button class="icon-btn" routerLink="/wishlist" aria-label="Wishlist">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                </svg>
            </button>
            <button class="icon-btn cart-btn" routerLink="/cart" aria-label="Cart">
                @if((cartCount$ | async)! > 0) {
                <span class="cart-count">{{ cartCount$ | async }}</span>
                }
                <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1" />
                    <circle cx="20" cy="21" r="1" />
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
                </svg>
            </button>
            <button class="account-btn" routerLink="/account" (click)="closeMenu()">Account</button>
        </div>
    </div>
</header>
